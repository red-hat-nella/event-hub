# Overlay `dev`: única variante de ambiente en el alcance de esta feature
# (plan.md §11 — no se crean overlays/staging ni overlays/production).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Labels comunes de ambiente/pertenencia (plan.md §5). No se marcan como
# selectores (includeSelectors: false, el valor por defecto) para no tocar
# los selectores/plantillas ya fijados en la base.
labels:
  - pairs:
      app.kubernetes.io/part-of: event-hub
      app.kubernetes.io/environment: dev

# Réplicas explícitas para los 5 workloads de aplicación (ya es el valor
# por defecto en cada deployment.yaml de la base; se declara aquí de forma
# explícita per la petición del plan). Las 3 bases de datos son
# StatefulSet y no se listan aquí porque su réplica única ya está fijada
# en su propio manifiesto base y no forma parte de "los 5 workloads".
replicas:
  - name: frontend
    count: 1
  - name: api-gateway
    count: 1
  - name: user-service
    count: 1
  - name: event-service
    count: 1
  - name: registration-service
    count: 1

# El orquestador sustituye los placeholders directamente en las bases.
# No repetirlos en images/newName: al sustituirlos por referencias con
# digest, Kustomize puede concatenar el digest y generar InvalidImageName.
