# Valores no sensibles de user-service (plan.md §10). Host/puerto/nombre de
# su propia base (db-users) y datos del seed admin no sensibles.
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  labels:
    app.kubernetes.io/name: event-hub
    app.kubernetes.io/component: user-service
data:
  DB_HOST: "db-users"
  DB_PORT: "5432"
  DB_NAME: "users"
  SEED_ADMIN_EMAIL: "admin@event-hub.local"
  LOG_LEVEL: "info"
