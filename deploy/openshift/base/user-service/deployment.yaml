apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: event-hub
    app.kubernetes.io/component: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-hub
      app.kubernetes.io/component: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-hub
        app.kubernetes.io/component: user-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # DATABASE_URL no puede vivir en ConfigMap/Secret como un solo valor
      # porque Prisma exige una única cadena de conexión y las credenciales
      # (`db-users-credentials`) solo declaran las claves `username`/
      # `password` (.sdd/workloads.yaml) — nunca una URL completa. Se
      # compone en el propio Pod a partir de host/puerto/nombre (ConfigMap,
      # no sensible) + usuario/password (Secret) usando la sustitución
      # `$(VAR)` de variables dependientes que Kubernetes resuelve dentro de
      # la misma lista `env` (nunca se escribe el valor compuesto en Git).
      initContainers:
        - name: migrate
          image: IMAGE_USER_SERVICE
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-users-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-users-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?schema=public"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: user-service
          image: IMAGE_USER_SERVICE
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: user-service-config
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-users-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-users-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?schema=public"
            # Secret `jwt-signing-key` (clave `secret`) — firma los JWT
            # (plan.md §10).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-signing-key
                  key: secret
            # Secret `internal-service-token` (clave `token`).
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-service-token
                  key: token
            # Secret `user-service-seed-admin` (clave `password`); el email
            # no sensible viene del ConfigMap (`SEED_ADMIN_EMAIL`).
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-seed-admin
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
