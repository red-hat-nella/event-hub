apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: event-hub
    app.kubernetes.io/component: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: event-hub
    app.kubernetes.io/component: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
